<!DOCTYPE html>
<html>
<head>
<title>Register - Expense Tracker</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
height:100vh;
display:flex;
background:linear-gradient(135deg,#344ec2,#7e22db);
}

/* LEFT SIDE */
.left{
flex:1;
color:white;
display:flex;
flex-direction:column;
justify-content:center;
padding:60px;
}

.left h1{
font-size:42px;
margin-bottom:20px;
}

.left p{
font-size:18px;
margin-bottom:30px;
opacity:0.9;
}

.features div{
margin-bottom:15px;
font-size:16px;
}

/* RIGHT SIDE */
.right{
flex:1;
display:flex;
justify-content:center;
align-items:center;
}

.card{
background:rgba(255,255,255,0.15);
backdrop-filter:blur(12px);
padding:40px;
border-radius:16px;
width:350px;
color:white;
box-shadow:0 8px 30px rgba(0,0,0,0.2);
}

.card h2{
margin-bottom:20px;
text-align:center;
}

/* INPUTS */
input{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:8px;
outline:none;
}

input::placeholder{
color:#666;
}

/* BUTTON */
button{
width:100%;
padding:12px;
margin-top:10px;
background:white;
color:#667eea;
border:none;
border-radius:8px;
font-size:16px;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#f1f1f1;
}

/* LINK */
.link{
margin-top:15px;
text-align:center;
}

.link a{
color:white;
text-decoration:underline;
}

/* RESPONSIVE */
@media(max-width:900px){
.left{
display:none;
}
}

</style>

</head>

<body>

<!-- LEFT SIDE -->
<div class="left">
<h1>Join Smart Expense Tracker</h1>
<p>Start managing your money smarter with AI-powered insights.</p>

<div class="features">
<div>✔ Track daily expenses easily</div>
<div>✔ AI-powered predictions</div>
<div>✔ Smart category detection</div>
<div>✔ Secure cloud storage</div>
</div>
</div>

<!-- RIGHT SIDE -->
<div class="right">
<div class="card">

<h2>Create Account</h2>

<form method="POST">

<input type="text" name="username" placeholder="Username" required>

<input type="password" name="password" placeholder="Password" required>

<button type="submit">Register</button>

</form>

<div class="link">
<p>Already have an account? <a href="/login">Login</a></p>
</div>

</div>
</div>

</body>
</html>
